[project]
name = "base-github-template"
version = "0.1.0"
description = "Plantilla base de repositorio para las prácticas de Aprendizaje Automático (UAX): CNN, RNN, RAG, etc."
authors = [
    {name = "María González",email = "mgonzgarc@myuax.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy (>=2.5.3,<3.0.0)",
    "pandas (>=3.0.6,<4.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "torch (>=2.14.0,<3.0.0)",
    "transformers (>=5.17.0,<6.0.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "streamlit (>=1.64.0,<2.0.0)",
    "gradio (>=6.28.0,<7.0.0)",
    "huggingface-hub (>=1.32.0,<2.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.16.8,<0.17.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
